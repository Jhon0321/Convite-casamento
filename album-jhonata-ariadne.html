<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum — Ariadne & Jhonata</title>
<link rel="icon" href="icone.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F7F4EC;--paper:#fff;--ink:#3A3A32;--olive:#5C6B44;--olive-dark:#485535;--gold:#AD8A4E;--line:#D9D2BE}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--olive-dark);font-family:'Jost',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
h1,h2,.serif{font-family:'Cormorant Garamond',serif}
header{text-align:center;padding:56px 24px 26px}
.eyebrow{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(36px,7vw,58px);font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 6px;color:var(--olive)}
.date{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--ink)}
.divider{display:flex;align-items:center;gap:10px;max-width:480px;margin:26px auto 0}
.divider i{flex:1;height:1px;background:var(--olive);opacity:.5}
.divider svg{width:16px;height:16px;color:var(--olive)}
main{max-width:1100px;margin:0 auto;padding:10px 20px 70px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:22px 0}
.btn,.tab{font:400 12.5px 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--olive);background:transparent;color:var(--olive);padding:11px 20px;border-radius:3px;cursor:pointer;transition:.2s}
.btn:hover:not(:disabled),.tab:hover{background:var(--olive);color:var(--ivory)}
.btn:disabled{opacity:.35;cursor:default}
.btn.solid,.tab.on{background:var(--olive);color:var(--ivory)}
.tab{padding:10px 0;min-width:40px;text-align:center;letter-spacing:0;font-size:14px}
.dots{color:var(--olive);padding:0 4px}
.count{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--ink);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr);gap:16px}}
.ph{aspect-ratio:3/4;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:zoom-in;padding:0;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s,transform .5s}
.ph img.ok{opacity:1}
.ph:hover img{transform:scale(1.04)}
.empty{text-align:center;max-width:520px;margin:50px auto;line-height:1.8;font-size:16px}
.empty h2{font-size:30px;font-weight:500;color:var(--olive);margin:0 0 10px}
.empty .box{border:1px solid var(--line);background:var(--paper);padding:34px 22px;border-radius:4px}
.empty small{display:block;margin-top:18px;font-size:13px;opacity:.75}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(30,32,24,.94);display:none;align-items:center;justify-content:center;z-index:9}
#lb.open{display:flex}
#lb img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:3px}
#lb button{position:absolute;background:none;border:0;color:#F7F4EC;cursor:pointer;font-size:38px;font-family:'Cormorant Garamond',serif;padding:14px 18px;opacity:.8}
#lb button:hover{opacity:1}
#lb .x{top:6px;right:8px}#lb .p{left:6px;top:50%;transform:translateY(-50%)}#lb .n{right:6px;top:50%;transform:translateY(-50%)}
#lb .c{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#F7F4EC;font-size:13px;letter-spacing:.2em;opacity:.8}
</style>
</head>

</header>
<main id="app"></main>

const EXT = /\.(jpe?g|png|webp|gif|avif|bmp)$/i;
const app = document.getElementById('app');
let itens = [];      // {nome, url?} (servidor) ou {nome, file} (pasta escolhida)
let aba = 0, urls = [];
const total = () => Math.ceil(itens.length / POR_ABA);
const collator = new Intl.Collator('pt-BR', {numeric:true});

// Cria a URL só no momento de exibir (nada é carregado antes)
const fonte = it => { if (it.url) return it.url; const u = URL.createObjectURL(it.file); urls.push(u); return u; };
const limpar = () => { urls.forEach(URL.revokeObjectURL); urls = []; };

// Detecção automática da pasta (sem escolher nada), em 3 tentativas:
const montar = (nomes, base) => { nomes = [...new Set(nomes)].filter(n => EXT.test(n)).sort(collator.compare);
  if(!nomes.length) return false; itens = nomes.map(n => ({nome:n, url: base + encodeURIComponent(n)})); return true; };
async function viaServidor(){
  if (location.protocol === 'file:') return false;
  const base = encodeURI(PASTA) + '/';
  // 1) lista.json dentro da pasta (gerado por gerar-lista.bat / gerar-lista.py)
  try{ const r = await fetch(base + 'lista.json', {cache:'no-cache'});
    if(r.ok && montar(await r.json(), base)) return true; }catch(e){}
  // 2) listagem de diretório do servidor
  try{ const r = await fetch(base); if(r.ok){
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    const nomes = [...doc.querySelectorAll('a')].map(a => decodeURIComponent((a.getAttribute('href')||'').split('?')[0].split('/').pop()));
    if(montar(nomes, base)) return true; } }catch(e){}
  // 3) GitHub Pages: lê a pasta direto do repositório
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  if(m){ try{ const repo = location.pathname.split('/')[1] || location.hostname;
    const r = await fetch(`https://api.github.com/repos/${m[1]}/${repo}/contents/${encodeURIComponent(PASTA)}`);
    if(r.ok && montar((await r.json()).map(f => f.name), base)) return true; }catch(e){} }
  return false;
}

// 2) Fallback: o usuário escolhe a pasta (funciona abrindo o arquivo direto no PC)
document.getElementById('pick').addEventListener('change', e => {
  const fs = [...e.target.files].filter(f => EXT.test(f.name)).sort((a,b) => collator.compare(a.name,b.name));
  if(!fs.length) return;
  itens = fs.map(f => ({nome:f.name, file:f})); aba = 0; render();
});

function vazio(){
  const local = location.protocol === 'file:';
  app.innerHTML = `<div class="empty"><div class="box"><h2>${local ? 'Abrir fotos' : 'Fotos não encontradas'}</h2>
  <p>${local ? `Aberto direto do computador: selecione a pasta <b>“${PASTA}”</b> para ver o álbum.`
   : `Não encontrei fotos na pasta <b>“${PASTA}”</b>. Rode o <b>gerar-lista.bat</b> (ou .py), envie o arquivo <b>lista.json</b> gerado para dentro da pasta e atualize esta página.`}</p>
  <button class="btn ${local?'solid':''}" id="abrir">Selecionar pasta</button></div></div>`;
  document.getElementById('abrir').onclick = () => document.getElementById('pick').click();
}

function paginas(){
  const n = total(), s = new Set([0, n-1, aba-1, aba, aba+1]);
  let html = '', ult = -1;
  [...s].filter(i => i>=0 && i<n).sort((a,b)=>a-b).forEach(i => {
    if(ult>=0 && i-ult>1) html += '<span class="dots">…</span>';
    html += `<button class="tab${i===aba?' on':''}" data-i="${i}">${i+1}</button>`; ult = i;
  });
  return html;
}

function render(){

  app.innerHTML = nav + `<p class="count">Fotos ${ini+1}–${fim} de ${itens.length}</p><div class="grid"></div>` + nav;
  const g = app.querySelector('.grid');
  itens.slice(ini, fim).forEach((it, k) => {
    const b = document.createElement('button'); b.className = 'ph'; b.onclick = () => abrir(ini+k);
    const im = new Image(); im.decoding = 'async'; im.alt = 'Foto ' + (ini+k+1);
    im.onload = () => im.classList.add('ok'); im.src = fonte(it);
    b.appendChild(im); g.appendChild(b);
  });
  app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => ir(+b.dataset.i));
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => ir(aba + +b.dataset.go));
}
function ir(i){ aba = Math.max(0, Math.min(total()-1, i)); render(); scrollTo({top:0, behavior:'smooth'}); }

// Visualização completa
const lb = document.getElementById('lb'), lbi = lb.querySelector('img'), lbc = lb.querySelector('.c');
let atual = 0, lbUrl = null;
function abrir(i){
  atual = (i + itens.length) % itens.length;
  if(lbUrl){ URL.revokeObjectURL(lbUrl); lbUrl = null; }
  const it = itens[atual];
  if(it.file){ lbUrl = URL.createObjectURL(it.file); lbi.src = lbUrl; } else lbi.src = it.url;
  lbc.textContent = `${atual+1} / ${itens.length}`; lb.classList.add('open');
}
function fechar(){ lb.classList.remove('open'); lbi.removeAttribute('src'); if(lbUrl){ URL.revokeObjectURL(lbUrl); lbUrl=null; }
  const a = Math.floor(atual/POR_ABA); if(a !== aba){ aba = a; render(); } }
lb.querySelector('.x').onclick = fechar;
lb.querySelector('.p').onclick = e => { e.stopPropagation(); abrir(atual-1); };
lb.querySelector('.n').onclick = e => { e.stopPropagation(); abrir(atual+1); };
lb.onclick = e => { if(e.target === lb) fechar(); };
addEventListener('keydown', e => { if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') fechar(); if(e.key==='ArrowLeft') abrir(atual-1); if(e.key==='ArrowRight') abrir(atual+1); });
let x0 = null; lb.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
lb.addEventListener('touchend', e => { if(x0===null) return; const d = e.changedTouches[0].clientX - x0; if(Math.abs(d)>50) abrir(atual + (d<0?1:-1)); x0=null; });

(async () => {
  if (montar(FOTOS, encodeURI(PASTA) + '/')) return render();   // lista embutida
  (await viaServidor()) ? render() : vazio();                    // reserva, se a lista estiver vazia
})();
</script>
